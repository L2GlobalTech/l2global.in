<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="320" fill="#F6F5F8" rx="20"/>
  <line x1="80" y1="160" x2="920" y2="160" stroke="#C1D5FF" stroke-width="4"/>

  <!-- Spring -->
  <circle cx="180" cy="160" r="16" fill="#195DF0"/>
  <text x="180" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0D1526">Spring</text>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">Preview sandbox</text>
  <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">window opens</text>

  <!-- Summer -->
  <circle cx="500" cy="160" r="16" fill="#F49308"/>
  <text x="500" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0D1526">Summer</text>
  <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">Release notes</text>
  <text x="500" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">published</text>

  <!-- Winter -->
  <circle cx="820" cy="160" r="16" fill="#2DB470"/>
  <text x="820" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0D1526">Winter</text>
  <text x="820" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">Production</text>
  <text x="820" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6F6C90">rollout weekend</text>

  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8152E0" font-weight="600">Salesforce ships three major releases every year — the cycle repeats continuously</text>
</svg>
